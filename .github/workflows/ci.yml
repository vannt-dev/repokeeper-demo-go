# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@v0
  go:
    uses: vannt-dev/repokeeper/.github/workflows/stack-go.yml@v0
    with:
      go-versions: '["stable"]'
      os: '["ubuntu-latest"]'
      commands: '["test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }","go vet ./...","go test ./..."]'
